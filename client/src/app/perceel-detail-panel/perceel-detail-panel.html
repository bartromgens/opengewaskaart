@if (loading()) {
  <aside class="detail-panel">
    <p class="status">Perceel laden…</p>
  </aside>
} @else if (error(); as message) {
  <aside class="detail-panel">
    <button type="button" class="close-button" (click)="closed.emit()" aria-label="Sluiten">
      <mat-icon>close</mat-icon>
    </button>
    <p class="status error">{{ message }}</p>
  </aside>
} @else if (perceel(); as parcel) {
  <aside class="detail-panel">
    <button type="button" class="close-button" (click)="closed.emit()" aria-label="Sluiten">
      <mat-icon>close</mat-icon>
    </button>

    <h2>{{ parcel.gewas }}</h2>
    <dl>
      <div>
        <dt>Jaar</dt>
        <dd>{{ parcel.jaar }}</dd>
      </div>
      <div>
        <dt>Gewas</dt>
        <dd>{{ parcel.gewas }}</dd>
      </div>
      <div>
        <dt>Categorie</dt>
        <dd>{{ parcel.category }}</dd>
      </div>
      <div>
        <dt>Status</dt>
        <dd>{{ parcel.status }}</dd>
      </div>
    </dl>
  </aside>
}
